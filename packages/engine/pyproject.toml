[project]
name = "skalu-engine"
version = "2.0.0"
description = "Native PDF line and rectangle detection engine"
requires-python = ">=3.14,<3.15"
dependencies = [
  "opencv-python-headless==5.0.0.93", "numpy==2.5.3", "PyMuPDF==1.28.2",
  "Pillow==12.3.0", "tqdm==4.70.1", "Flask==3.1.3", "gunicorn==26.2.0"
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
