name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.14.7
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv sync --project packages/engine --frozen
      - run: bun run typecheck && bun run check && bun run test
      - run: bun run test:engine
      - run: bun run build && bun run types:generate
      - run: bun run --cwd apps/worker build
      - run: docker build --platform linux/amd64 -t skalu-engine:test packages/engine
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: test-results/
