name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "demo_utils.py"
      - "skalu.py"
      - "requirements.txt"
      - "Dockerfile"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: skalu-api
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless via WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/skalu/api:${{ github.sha }}"
          docker build -t "${IMAGE}" -t "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/skalu/api:latest" .
          docker push "${IMAGE}"
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/skalu/api:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/skalu/api:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --no-cpu-throttling \
            --min-instances 1 \
            --max-instances 2 \
            --memory 1Gi \
            --timeout 3600 \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }} \
            --quiet

      - name: Output service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)" \
            --project ${{ env.PROJECT_ID }}
